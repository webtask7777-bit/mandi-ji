name: Mandi prices

# Fetch the data.gov.in current-price dataset, merge it into server/db/data/daily by
# arrival date, rebuild the aggregates and commit. Vercel deploys the push to main.
# The publisher refreshes the dataset around 20:00 UTC (01:30 IST); the second run
# catches late updates.
on:
  schedule:
    - cron: '45 20 * * *'
    - cron: '30 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mandi-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340  # the public sample key needs ~3 h; a registered key is much faster
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Only progress backed by successfully committed records is restored.
      - uses: actions/cache/restore@v4
        with:
          path: .cache/datagov
          key: datagov-committed-v2-${{ github.run_id }}
          restore-keys: datagov-committed-v2-

      - name: Fetch current prices
        id: fetch
        # Complete state slices are already validated and merged atomically. Keep
        # those observations even if another state fails; report failure below.
        continue-on-error: true
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: node scripts/fetch-daily.cjs --delay 1300

      - name: Rebuild aggregates
        run: node scripts/aggregate-india.cjs

      - name: Storage tests
        run: node --test tests/daily-store.test.mjs tests/price-workflow.test.mjs

      - name: Commit if anything changed
        id: commit_data
        run: |
          git add server/db/data
          if git diff --cached --quiet; then
            echo "No new observations."
          else
            git config user.name "sahibhav-data-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: mandi prices $(date -u +%F)"
            git push
          fi

      # Completion flags must never survive without their corresponding records.
      # A failed validation or push leaves the previous durable cache untouched.
      - name: Keep fetch progress for the next run
        if: success() && steps.commit_data.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .cache/datagov
          key: datagov-committed-v2-${{ github.run_id }}

      - name: Freshness
        run: node scripts/check-freshness.cjs --max-age-days 3

      # continue-on-error above permits recovery, never a false successful run.
      - name: Report incomplete fetch
        if: always() && steps.fetch.outcome == 'failure'
        run: |
          echo "::error::Price fetch was incomplete. Only validated observations that were successfully committed can be resumed."
          exit 1
